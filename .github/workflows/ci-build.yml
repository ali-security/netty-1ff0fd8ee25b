name: Build project

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional surefire -Dtest selector"
        required: false
        default: ""

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryhandler.count=5 -Dmaven.wagon.httpconnectionManager.ttlSeconds=240

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - setup: linux-x86_64-java11
            docker-compose-build: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml build"
            docker-compose-run: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml run build"
          - setup: linux-x86_64-java11-boringssl
            docker-compose-build: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml build"
            docker-compose-run: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml run build-handler-boringssl"
          - setup: linux-x86_64-java11-testsuite
            docker-compose-build: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml build"
            docker-compose-run: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml run build-testsuite"
          - setup: linux-x86_64-java11-codecs
            docker-compose-build: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml build"
            docker-compose-run: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml run build-codecs"
          - setup: linux-x86_64-java11-testsuites-extra
            docker-compose-build: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml build"
            docker-compose-run: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.111.yaml run build-testsuites-extra"
          - setup: linux-x86_64-java8-codec-http
            docker-compose-build: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.18.yaml build"
            docker-compose-run: "-f docker/docker-compose.yaml -f docker/docker-compose.centos-6.18.yaml run build-codec-http"
          # Conscrypt's native library needs glibc >= 2.16, the centos-6 image has 2.12, so the Conscrypt test
          # classes (and JdkSslEngineTest's ALPN_CONSCRYPT variants) skip in the boringssl leg; run them on the
          # ubuntu host with the same zulu 11.0.20 JDK.
          - setup: linux-x86_64-java11-conscrypt
            host-java: "11.0.20"
            host-run: "./mvnw -B -ntp clean install -pl handler -am -DskipTests=true -Dxml.skip=true && ./mvnw -B -ntp -Pboringssl test -pl handler -Dxml.skip=true -Dio.netty.testsuite.badHost=netty.io -Dtest=JdkSslEngineTest,ConscryptSslEngineTest,ConscryptJdkSslEngineInteropTest,ConscryptOpenSslEngineInteropTest,JdkConscryptSslEngineInteropTest,OpenSslConscryptSslEngineInteropTest -Dsurefire.failIfNoSpecifiedTests=false"

    name: ${{ matrix.setup }}
    steps:
      - uses: actions/checkout@v4

      # Cache .m2/repository
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ matrix.setup }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ matrix.setup }}-
            ${{ runner.os }}-maven-

      - name: Set up host JDK
        if: ${{ matrix.host-java }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.host-java }}

      - name: Build docker image
        if: ${{ !matrix.host-java }}
        run: docker compose ${{ matrix.docker-compose-build }}

      - name: Build project without leak detection
        timeout-minutes: 50
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: ${{ matrix.host-run || format('docker compose {0}', matrix.docker-compose-run) }} | tee build.output

      - name: Print skipped tests and their reasons
        if: always()
        run: |
          python3 - <<'PY'
          # Surefire only prints a per-class skip count. List every skipped test with its reason and, when
          # JUnit only says "assumption is not true/false", the assume*() condition from the test source.
          import glob
          import re
          import xml.etree.ElementTree as ET

          GENERIC = re.compile(r'^(Assumption failed: )?assumption is not (true|false)$|^$')

          sources = {}
          for path in glob.glob('**/src/test/java/**/*.java', recursive=True) + \
                  glob.glob('testsuite*/src/main/java/**/*.java', recursive=True):
              sources.setdefault(path.rsplit('/', 1)[-1][:-5], path)

          cache = {}


          def read(name):
              if name not in cache:
                  path = sources.get(name)
                  cache[name] = open(path, encoding='utf-8', errors='replace').read() if path else None
              return cache[name]


          def assumes(text):
              return [line.strip().rstrip(';') for line in text.splitlines() if 'assume' in line and '(' in line
                      and not re.match(r'\s*(import|public|private|protected|static|void)\b', line)]


          def method_bodies(text, method):
              bodies = []
              for match in re.finditer(r'\bvoid\s+' + re.escape(method) + r'\s*\(', text):
                  start = text.find('{', match.end())
                  if start < 0:
                      continue
                  depth = 0
                  for i in range(start, len(text)):
                      if text[i] == '{':
                          depth += 1
                      elif text[i] == '}':
                          depth -= 1
                          if depth == 0:
                              bodies.append(text[start:i + 1])
                              break
              return bodies


          def explain(classname, method):
              chain = []
              simple = classname.rsplit('.', 1)[-1].split('$')[0]
              while simple and simple not in [c for c, _ in chain]:
                  text = read(simple)
                  if text is None:
                      break
                  chain.append((simple, text))
                  parent = re.search(r'\bclass\s+' + re.escape(simple) + r'\b[^{]*?\bextends\s+([A-Za-z0-9_]+)', text)
                  simple = parent.group(1) if parent else None
              if method:
                  for simple, text in chain:
                      found = [a for body in method_bodies(text, method) for a in assumes(body)]
                      if found:
                          return '%s.%s: %s' % (simple, method, '; '.join(dict.fromkeys(found)))
              for simple, text in chain:
                  found = assumes(text)
                  if found:
                      return '%s (class-level): %s' % (simple, '; '.join(list(dict.fromkeys(found))[:4]))
              return None


          FRAME = re.compile(r'at io\.netty\.[\w.$]+\((\w+)\.java:(\d+)\)')


          def failed_line(trace):
              for simple, line in FRAME.findall(trace or ''):
                  text = read(simple)
                  if text is not None:
                      lines = text.splitlines()
                      if int(line) <= len(lines):
                          return '%s.java:%s: %s' % (simple, line, lines[int(line) - 1].strip().rstrip(';'))
              return None


          # JdkSslEngineTest wraps "provider not available" in TestAbortedException("Not expected"); its parameters are
          # ProviderType.values() x newTestParams(), so the [index] tells which provider type was unavailable.
          PROVIDERS = [
              ('NPN_JETTY', 'JettyNpnSslEngine.isAvailable() is false: Jetty npn-boot exists only for JDK 7/8 bootclasspaths,'
                            ' so NPN is not on the classpath of this JDK 11 run'),
              ('ALPN_JETTY', 'JettyAlpnSslEngine.isAvailable() is false: Jetty alpn-boot exists only for JDK 8 bootclasspaths;'
                             ' JDK 9+ ALPN is exercised by the ALPN_JAVA variants, which ran'),
              ('ALPN_JAVA', 'JdkAlpnSslUtils.supportsAlpn() is false on this JDK'),
              ('ALPN_CONSCRYPT', 'Conscrypt.isAvailable() is false: the conscrypt native library needs GLIBC_2.16 but the'
                                 ' centos-6 image has glibc 2.12; these variants run in the linux-x86_64-java11-conscrypt leg'),
          ]
          method_sizes = {}


          def base_name(name):
              return re.split(r'[{\[(]', name or '', 1)[0]


          def jdk_provider_reason(report, name, text):
              key = (report, base_name(name))
              if key not in method_sizes:
                  method_sizes[key] = sum(1 for c in ET.parse(report).getroot().iter('testcase')
                                          if base_name(c.get('name')) == key[1])
              index = re.search(r'\[(\d+)\]$', name or '')
              cause = re.search(r'SkipTestException: ([^\n]+)', text or '')
              detail = cause.group(1).strip() if cause else 'tlsExtensionNotFound'
              if not index or method_sizes[key] % len(PROVIDERS):
                  return 'Not expected [SkipTestException: %s]' % detail
              provider, why = PROVIDERS[(int(index.group(1)) - 1) // (method_sizes[key] // len(PROVIDERS))]
              return 'Not expected [SkipTestException(%s) for providerType=%s: %s]' % (detail, provider, why)

          reports = glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True)
          reports += glob.glob('**/target/failsafe-reports/TEST-*.xml', recursive=True)
          run = failed = errored = skipped = 0
          groups = {}
          for report in sorted(reports):
              for case in ET.parse(report).getroot().iter('testcase'):
                  run += 1
                  if case.find('failure') is not None:
                      failed += 1
                  if case.find('error') is not None:
                      errored += 1
                  skip = case.find('skipped')
                  if skip is None:
                      continue
                  skipped += 1
                  reason = ' '.join((skip.get('message') or '').split())
                  classname, name = case.get('classname') or '', case.get('name') or ''
                  if GENERIC.match(reason):
                      at = failed_line(skip.text)
                      if at:
                          reason = '%s [failed assumption at %s]' % (reason or 'no message', at)
                      else:
                          method = re.split(r'[{\[(]', name, 1)[0]
                          source = explain(classname, None if method == classname else method)
                          if source:
                              reason = '%s [failed assumption in %s]' % (reason or 'no message', source)
                  elif reason.startswith('assumption was not met'):
                      at = failed_line(skip.text)
                      if at:
                          reason = '%s [failed assumption at %s]' % (reason, at)
                  elif reason == 'Not expected' and classname.endswith('.JdkSslEngineTest'):
                      reason = jdk_provider_reason(report, name, skip.text)
                  print('SKIPPED %s.%s -- %s' % (classname, name, reason or 'no reason given'))
                  short = re.sub(r'(\[failed assumption (?:at|in) \w+)[^:]*', r'\1', reason or 'no reason given')
                  groups.setdefault(short, {}).setdefault(classname.rsplit('.', 1)[-1], 0)
                  groups[short][classname.rsplit('.', 1)[-1]] += 1
          print('Total skipped tests: %d' % skipped)
          # The per-test list above is long; repeat it grouped by reason so every skip reason is visible at once.
          print('Skip reasons grouped (count -- reason -- classes):')
          for reason, classes in sorted(groups.items(), key=lambda kv: -sum(kv[1].values())):
              print('  %5d -- %s -- %s' % (sum(classes.values()), reason, ', '.join(sorted(classes))))
          specs = []
          for pom in glob.glob('testsuite-http2/pom.xml'):
              specs = re.findall(r'<excludeSpec>(.*?)</excludeSpec>', open(pom, encoding='utf-8').read())
          if specs and glob.glob('testsuite-http2/target'):
              print('h2spec: any "failed" spec in the h2spec report is one of these %d specs upstream lists in'
                    ' testsuite-http2/pom.xml <excludeSpecs> as known non-compliances; h2spec-maven-plugin ignores'
                    ' them and fails the build on any other failing spec:' % len(specs))
              for spec in specs:
                  print('  excluded h2spec: %s' % spec)
          print('Test totals over %d report files: run %d, passed %d, failures %d, errors %d, skipped %d'
                % (len(reports), run, run - failed - errored - skipped, failed, errored, skipped))
          PY

      - name: Explain environment-dependent skips
        if: always()
        env:
          HOST_LEG: ${{ matrix.host-java }}
        run: |
          python3 - <<'PY'
          # Surefire/h2spec skips that depend on the CI image rather than on netty code: print the evidence.
          import glob
          import os
          import re
          import subprocess
          import zipfile

          output = open('build.output', encoding='utf-8', errors='replace').read() if os.path.exists('build.output') else ''
          jars = glob.glob(os.path.expanduser('~/.m2/repository/org/conscrypt/conscrypt-openjdk-uber/*/*.jar'))
          if jars and 'Conscrypt' in output and not os.environ.get('HOST_LEG'):
              print('Conscrypt native library: %s' % jars[0])
              with zipfile.ZipFile(jars[0]) as jar:
                  for name in jar.namelist():
                      if name.startswith('META-INF/native/') and 'linux' in name and 'x86_64' in name:
                          data = jar.read(name).decode('latin-1')
                          versions = sorted(set(re.findall(r'GLIBC_([0-9.]+)', data)),
                                            key=lambda v: [int(x) for x in v.split('.')])
                          print('  %s needs glibc symbols up to GLIBC_%s' % (name, versions[-1] if versions else '?'))
              images = subprocess.run(['docker', 'images', '--format', '{{.Repository}}:{{.Tag}}'],
                                      capture_output=True, text=True).stdout.split()
              for image in [i for i in images if i.startswith('netty:centos')][:1]:
                  ldd = subprocess.run(['docker', 'run', '--rm', '--entrypoint', 'ldd', image, '--version'],
                                       capture_output=True, text=True)
                  print('  test container %s: %s' % (image, (ldd.stdout or ldd.stderr).splitlines()[:1]))
              print('  => Conscrypt-based SSL test variants skip because Conscrypt.isAvailable() is false: the'
                    ' centos-6 test image ships glibc 2.12, older than the GLIBC_2.16 symbols the'
                    ' conscrypt-openjdk-uber native library requires. These Conscrypt test classes run instead in'
                    ' the linux-x86_64-java11-conscrypt leg on the ubuntu host (newer glibc).')
          if 'h2spec' in output:
              print('h2spec summary lines:')
              for line in re.findall(r'.*\d+ tests, \d+ passed, \d+ skipped, \d+ failed.*', output)[:20]:
                  print('  ' + line.strip())
              print('  => h2spec itself skips spec 5.1.2 (SETTINGS_MAX_CONCURRENT_STREAMS) because netty\'s'
                    ' testsuite-http2 Http2Server does not advertise SETTINGS_MAX_CONCURRENT_STREAMS, so there is'
                    ' no stream limit to exercise.')
          PY

      - name: Checking for test failures
        run: ./.github/scripts/check_build_result.sh build.output

      - name: Checking bom dependency versions
        run: ./.github/scripts/check_bom_dependencies.sh

      - name: print JVM thread dumps when cancelled
        uses: ./.github/actions/thread-dump-jvms
        if: cancelled()

